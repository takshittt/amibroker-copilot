[project]
name = "copilot"
version = "0.1.0"
description = "AFL Copilot API: pipeline and checker"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
