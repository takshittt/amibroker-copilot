[project]
name = "copilot"
version = "0.1.0"
description = "AFL Copilot API: pipeline and checker"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "openai>=1.50",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pyjwt>=2.9",
    "pyyaml>=6",
    "redis>=5.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
