id: assignment-in-condition
title: One equals sign where a comparison is meant
checker_rule: syntax
explanation: >-
  A single = stores a value; it does not compare. AFL does not accept an
  assignment inside the brackets of if, while or IIf, so the formula will
  not run. Use == to ask whether two values are equal.
bad_example: |
  Mode = Param("Mode", 1, 1, 2, 1);
  Length = 20;
  if (Mode = 2)
  {
      Length = 50;
  }
  Plot(MA(Close, Length), "Average", colorBlue);
good_example: |
  Mode = Param("Mode", 1, 1, 2, 1);
  Length = 20;
  if (Mode == 2)
  {
      Length = 50;
  }
  Plot(MA(Close, Length), "Average", colorBlue);
tags: [syntax, comparison]
