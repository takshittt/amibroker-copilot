id: intrabar-stop-without-price
title: Stop hit inside the bar, but no price set for the exit
checker_rule: intrabar_stop_price
explanation: >-
  Low < StopLevel says the stop was touched some time during the bar.
  Unless SellPrice is set, the backtest sells at its default price for
  that bar and not at the stop, so losses come out smaller or larger than
  they would really be. Set SellPrice to the stop, or to the open when
  the bar opens below the stop.
bad_example: |
  SetTradeDelays(0, 0, 0, 0);
  StopLevel = Ref(LLV(Low, 10), -1);
  Buy = Cross(Close, MA(Close, 50));
  Sell = Low < StopLevel;
good_example: |
  SetTradeDelays(0, 0, 0, 0);
  StopLevel = Ref(LLV(Low, 10), -1);
  Buy = Cross(Close, MA(Close, 50));
  Sell = Low < StopLevel;
  SellPrice = Min(Open, StopLevel);
tags: [stops, backtest, prices]
