name: ExRem
category: signal
returns: array
params:
  - {name: array1, type: array, optional: false}
  - {name: array2, type: array, optional: false}
description: >-
  Removes repeated signals: after a true bar in the first array, later
  trues are dropped until the second array is true.
doc_url: https://www.amibroker.com/guide/afl/exrem.html
since: "3.50"
