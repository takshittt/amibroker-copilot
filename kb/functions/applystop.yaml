name: ApplyStop
category: stops
returns: none
params:
  - {name: type, type: number, optional: false}
  - {name: mode, type: number, optional: false}
  - {name: amount, type: any, optional: false}
  - {name: exitatstop, type: number, optional: true}
  - {name: volatile, type: number, optional: true}
  - {name: reentrydelay, type: number, optional: true}
  - {name: validfrom, type: number, optional: true}
  - {name: validto, type: number, optional: true}
description: >-
  Switches on one of the backtester's built-in stops: a stop loss, a
  profit target, a trailing stop or an N-bar stop. The amount is read in
  the given mode: percent, points or bars.
doc_url: https://www.amibroker.com/guide/afl/applystop.html
since: "3.70"
